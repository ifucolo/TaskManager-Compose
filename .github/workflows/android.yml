name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 31
        build-tools-version: 31.0.0
        components: platform-tools

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Lint Code
      run: ./gradlew lint

    - name: Run Instrumented Tests on Emulator
      uses: reactivecircus/android-emulator-runner@v2.20.0
      with:
        api-level: 30
        target: default
        arch: x86_64
        profile: Nexus 6
        script: ./gradlew connectedAndroidTest

    - name: Build Release APK
      run: ./gradlew assembleRelease
