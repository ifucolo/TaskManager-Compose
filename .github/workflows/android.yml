name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 18
      uses: actions/setup-java@v4
      with:
        java-version: '18'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
    - name: Build with Gradle
      run: ./gradlew build

  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Unit Tests
      run: ./gradlew test

  code_coverage:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: "**/outputs/code_coverage/**/*.ec"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Lint Code
      run: ./gradlew lint

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Release APK
      run: ./gradlew assembleRelease
